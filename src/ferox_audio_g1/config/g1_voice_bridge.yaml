/**/g1_voice_bridge:
  ros__parameters:
    speaker_enabled: false
    query_volume_on_start: true
    # Do not send the one-shot request before volatile DDS discovery completes.
    endpoint_discovery_timeout_s: 5.0
    # Playback is fail-closed above this independently confirmed volume.
    max_enabled_volume: 25
    app_name: "ferox_speech"
    request_timeout_s: 2.0
    # Defaults preserve the reviewed Unitree PlayStream batching policy.
    # Hardware evidence may justify tuning these without changing code.
    target_request_ms: 1000
    max_buffer_ms: 3000
    max_interarrival_ms: 500
    idle_flush_ms: 150
